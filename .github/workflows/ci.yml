name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install biopython numpy pandas openpyxl pytest snakemake
      - name: Run focused unit tests
        run: python -m pytest -q
      - name: Compile workflow Python
        run: python -m compileall -q workflow/scripts workflow/builders portal tests
      - name: Parse Snakemake workflow
        run: |
          cp config/config.yaml.template config/config.yaml
          snakemake -s workflow/Snakefile --configfile examples/config.example.yaml --list-rules
      - name: Check atlas JavaScript syntax
        run: |
          node --check workflow/builders/template/databridge.js
          node --check workflow/builders/template/renderer.js
