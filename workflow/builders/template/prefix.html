<!DOCTYPE html><html><head><meta charset="utf-8">
<title>C. orbiculare SUSS atlas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.6/dist/vis-network.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.1.0/3Dmol-min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;font-family:-apple-system,Helvetica,Arial,sans-serif;color:#222}
#title{padding:9px 16px;background:#2a6b8a;color:#fff;font-size:14px}
#wrap{display:flex;flex:1;min-height:0}
#primary{flex:1;border-right:1px solid #ddd;background:#fbfbfb;min-width:0;position:relative;overflow:hidden}
#net,#singletons,#domains{width:100%;height:100%}
#singletons,#domains{overflow:auto;padding:12px 14px;background:#f8fafb}
#primary.collapsed{flex:none;width:0;border:none;overflow:hidden}
.mode-hidden{display:none!important}
#divider{width:6px;cursor:col-resize;background:#e0e0e0;flex:none}
#divider:hover{background:#2a6b8a}
#side{width:520px;flex:none;overflow-y:auto;padding:12px 15px;background:#fff}
#side.collapsed{width:0;padding:0;overflow:hidden}
#viewbar{padding:4px 16px;background:#f0f4f6;border-bottom:1px solid #ddd;font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#viewbar button{font-size:11px;padding:2px 8px;margin-right:5px}
.viewgroup{display:flex;align-items:center;gap:3px;white-space:nowrap}
.mode-tabs{display:flex;gap:0;border:1px solid #8da4b0;border-radius:5px;overflow:hidden}
.mode-tabs button{margin:0!important;border:0;border-right:1px solid #8da4b0;border-radius:0;background:#fff;min-height:26px}
.mode-tabs button:last-child{border-right:0}.mode-tabs button.on{background:#2a6b8a;color:#fff}
#netsearch{display:flex;align-items:center;gap:4px;margin-left:auto;min-width:250px;flex:0 1 390px}
#netsearch input{width:100%;min-width:150px;height:27px;border:1px solid #aeb9bf;border-radius:4px;padding:3px 30px 3px 9px;background:#fff;font-size:12px;color:#222}
#netsearch input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
#netsearch input:focus{outline:2px solid #2a6b8a;outline-offset:1px;border-color:#2a6b8a}
#clearsearch{width:24px;height:24px;padding:0!important;margin-left:-32px!important;margin-right:5px!important;border:0!important;background:transparent!important;font-size:17px!important;line-height:22px;color:#5f6b72}
#searchstatus{min-width:68px;color:#59666d;font-size:11px;white-space:nowrap}
h2{margin:0 0 4px;font-size:19px}h3{margin:12px 0 5px;font-size:12px;color:#2a6b8a;text-transform:uppercase;letter-spacing:.04em}
table{border-collapse:collapse;width:100%;font-size:12.5px}td{padding:3px 6px;border-bottom:1px solid #eee}td:first-child{color:#666;width:54%}
.singleton-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:9px;flex-wrap:wrap}
.singleton-head h2{margin:0}.singleton-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
.singleton-filters label{white-space:nowrap}.singleton-actions{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.singleton-table-wrap{overflow:auto;border:1px solid #dce3e7;background:#fff;border-radius:5px;max-height:calc(100vh - 185px)}
.singleton-table{min-width:1120px;font-size:11.5px}.singleton-table th{position:sticky;top:0;z-index:2;background:#eaf0f3;color:#38515e;text-align:left;padding:7px 6px;border-bottom:1px solid #bdcbd2;white-space:nowrap;cursor:pointer}
.singleton-table td{padding:6px;border-bottom:1px solid #edf0f2;vertical-align:top;color:#26343b;width:auto;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.singleton-table tr{cursor:pointer}.singleton-table tbody tr:hover{background:#eef7fa}.singleton-table tr.selected{background:#dceff5}
.domain-members{display:flex;gap:5px;flex-wrap:wrap}.domain-member{border:1px solid #cbd8de;background:#fff;border-radius:4px;padding:2px 6px;cursor:pointer;font-size:11px}.domain-member:hover{background:#e6f3f7;border-color:#6d9caf}
.status-pill{display:inline-block;border-radius:9px;padding:1px 6px;font-size:10px;white-space:nowrap;background:#e7ecef;color:#40525b}
.status-pill.good{background:#dff0e4;color:#24623a}.status-pill.warn{background:#fff0d5;color:#8a5b00}.status-pill.novel{background:#f8dfe0;color:#932d34}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:7px;font-size:11px;color:#5c6a72}
button{padding:5px 10px;border:1px solid #bbb;background:#fff;border-radius:5px;cursor:pointer;font-size:12px;margin:2px}
button.on{background:#2a6b8a;color:#fff;border-color:#2a6b8a}
a.dl{display:inline-block;padding:5px 12px;background:#1e8449;color:#fff;border-radius:5px;font-size:12px;text-decoration:none;margin:6px 0}
.hint{font-size:11px;color:#888;margin-top:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;color:#fff}
.swatch{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:middle;margin:0 2px}
.tabs{display:flex;gap:3px;border-bottom:2px solid #2a6b8a;margin:8px 0;flex-wrap:wrap}
.tab{padding:5px 10px;cursor:pointer;font-size:12px;border-radius:5px 5px 0 0;background:#eee}
.tab.on{background:#2a6b8a;color:#fff}
#v3d{width:100%;height:300px;border:1px solid #ddd;border-radius:6px;margin-top:6px;position:relative;background:#fff}
#treebox{border:1px solid #eee;border-radius:4px;overflow:auto;max-height:340px;margin-top:4px}
.pane{display:none}.pane.on{display:block}
.pane img{max-width:100%;border:1px solid #eee;border-radius:4px}
.sequence-toolbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:4px 0}
.sequence-toolbar select{max-width:190px;height:28px}
.sequence-view{width:100%;max-height:340px;overflow:auto;margin:7px 0;padding:9px;border:1px solid #dce3e7;border-radius:4px;background:#f8fafb;color:#203039;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}
svg text{cursor:pointer;user-select:none}
svg .branch{cursor:pointer}
svg .branch:hover{stroke:#e67e22 !important;stroke-width:3px !important}
@media(max-width:700px){
 body{min-height:100vh;height:100vh}
 #title{line-height:18px}
 #viewbar{padding:5px 8px;gap:6px}
 #netsearch{margin-left:0;min-width:0;flex:1 0 100%;width:100%}
 #wrap{display:block;overflow-y:auto}
 #primary{width:100%;height:52vh;min-height:300px;border-right:0;border-bottom:1px solid #ddd}
 #net,#singletons,#domains{width:100%;height:100%}
 #singletons,#domains{padding:9px}
 .singleton-table-wrap{max-height:none}
 #divider{display:none}
 #side{width:100%;height:auto;min-height:220px;overflow:visible}
 #primary.collapsed{width:100%;height:0;min-height:0}
 #side.collapsed{display:none;width:100%}
}
</style></head><body>
<div id="title">__ATLAS_TITLE__</div>
<div id="viewbar"><span class="mode-tabs"><button id="modeclusters" class="on" onclick="setAtlasMode('clusters')">Full-length families</button><button id="modedomains" onclick="setAtlasMode('domains')">Domain families</button><button id="modesingletons" onclick="setAtlasMode('singletons')">Singletons</button></span><span class="viewgroup"><button id="tgprimary" onclick="toggleView('primary')" title="Show or hide the current main view">Hide main view</button><button id="tgside" onclick="toggleView('side')">Hide detail panel</button></span><span class="viewgroup"><b>Download:</b> <button id="dlclustered" onclick="dlSummary('clustered')" title="One row per full-length family">Families CSV</button><button id="dlsingletons" onclick="dlSummary('singletons')" title="One row per singleton">Singleton CSV</button></span><div id="netsearch" title="Search all fields or use gene:, annotation:, effectorp:, tmr:, pdb:, afdb:, novel:"><input id="searchinput" type="search" autocomplete="off" spellcheck="false" placeholder="Search full-length families" aria-label="Search atlas"><button id="clearsearch" type="button" title="Clear search" aria-label="Clear search">&times;</button><span id="searchstatus" aria-live="polite"></span></div></div><div id="wrap"><div id="primary"><div id="net"></div><div id="domains" class="mode-hidden"></div><div id="singletons" class="mode-hidden"></div></div><div id="divider"></div><div id="side"><p class="hint">Select a full-length family, domain family, or singleton.</p></div></div>
